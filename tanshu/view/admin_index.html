<!doctype html>
<html>
<head>
    <include file="public@head"/>
    <title>新闻拉取</title>
    <meta name="description" content="新闻拉取">
    <meta name="keywords" content="新闻拉取">
    <style>
        .content-cell {
            height: 200px;
            overflow-y: auto;
            white-space: normal;
            padding: 5px;
            display: block;
        }


    </style>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a>获取新闻</a></li>
    </ul>
    <form class="well form-inline margin-top-20" method="post" action="">
        <div class="search_type cc mb10">
            <div class="mb10">
                新闻类型：
                <select class="form-control" name="type">
                    <foreach name="$types" id="type">
                        <option value="{:$type}" <if condition="$type eq $data['channel']">selected</if>>{:$type}</option>
                    </foreach>
                </select>
                <input type="submit" class="btn btn-primary" value="拉取"/>
                </span>
            </div>
        </div>
    </form>
    <form method="post" class="js-ajax-form" action="#">
        <div class="table_list">
            <table class="table table-hover table-bordered table-list" style="table-layout: fixed;">
                <thead>
                    <tr>
                        <th width="200">标题</th>
                        <th width="95">时间</th>
                        <th width="65">来源</th>
                        <th width="45">图片</th>
                        <th>内容</th>
                        <th width="115">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <foreach name="$data['list']" item="vo" key="k">
                        <tr>
                            <td><a href="{$vo.url}" target="_blank">{$vo.title}</a></td>
                            <td>{$vo.time}</td>
                            <td>{$vo.src}</td>
                            <td>
                                <notempty name="vo.pic">
                                    <a href="javascript:parent.imagePreviewDialog('{$vo.pic}');">
                                        <i class="fa fa-photo fa-fw" title="缩略图"></i>
                                    </a>
                                    <else/>
                                    <i class="fa fa-close fa-fw" title="缩略图"></i>
                                </notempty>
                            </td>
                            <td class="content-cell">{$vo['content']}</td>
                            <td><a onclick="doSelectCategory('{:$k}');">使用</a> | <a href="{$vo.weburl}" target="_blank">查看原文</a></td>
                        </tr>
                    </foreach>
                </tbody>
            </table>
        </div>
    </form>
</div>
<include file="public@scripts"/>
<script type="text/javascript">
    function doSelectCategory(key) {
        const list = {:json_encode($data['list'])};
        const selectedItem = list[key];
// In the parent window (plugin file)
        openIframeLayer("{:url('portal/AdminArticle/add')}", '添加新闻', {
            area: ['1200px', '800px'],
            success: function(layero, index) {
                const iframe = layero.find('iframe')[0];
                const iframeWindow = iframe.contentWindow;
                // Wait for iframe to load
                iframe.onload = function() {
                    // Send data with specific target origin or '*' for testing
                    iframeWindow.postMessage({
                        type: 'newsData',
                        data: selectedItem
                    }, '*'); // Use specific origin in production
                };

                // Fallback in case onload doesn't fire
                setTimeout(() => {
                    iframeWindow.postMessage({
                        type: 'newsData',
                        data: selectedItem
                    }, '*');
                }, 1000);
            },
            yes: function (index, layero) {
                layer.close(index);
            }
        });
    }
</script>
</body>
</html>

<!doctype html>
<html>
<head>
    <include file="public@head"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a>小程序管理</a></li>
        <li><a href="{:cmf_plugin_url('TencentApp://AdminApp/add')}">添加小程序</a></li>
    </ul>
    <form method="post" class="js-ajax-form margin-top-20" action="#">
        <div class="table_list">
            <table width="100%" class="table table-hover">
                <thead>
                <tr>
                    <th width="200">{:lang('NAME')}</th>
                    <th>App ID</th>
                    <th>App Secret</th>
                    <th>{:lang('TYPE')}</th>
                    <th width="110">{:lang('ACTIONS')}</th>
                </tr>
                </thead>
                <tbody>
                <foreach name="apps" item="vo">
                    <tr>
                        <td>{$vo.name|default=''}</td>
                        <td>{$vo.app_id|default=''}</td>
                        <td>{:substr($vo.app_secret, 0, 9).'******'|''}</td>
                        <td>{$vo.app_type|default=''}</td>
                        <td>
                            <a class="btn btn-xs btn-primary" href="{:cmf_plugin_url('TencentApp://AdminApp/edit',['id'=>$vo.app_id])}">{:lang('EDIT')}</a>
                            <a class="btn btn-xs btn-danger js-ajax-delete"
                               href="{:cmf_plugin_url('TencentApp://AdminApp/delete',['id'=>$vo.app_id])}">{:lang('DELETE')}</a>
                        </td>
                    </tr>
                </foreach>
                </tbody>
            </table>
        </div>
    </form>
</div>
<include file="public@scripts"/>
</body>
</html>
